[project]
name = "binoculars-eu"
version = "0.1.0"
description = "European open-source platform for zero-shot detection of AI-generated text, structured by language profiles."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [
    { name = "Michel-Marie Maudet" },
]
keywords = ["ai-detection", "binoculars", "multilingual", "luciole", "open-source", "zero-shot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.5.1",
    "transformers>=4.57.1",
    "accelerate>=0.34.0",
    "datasets>=2.21.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.9.0",
    "huggingface-hub>=0.24.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
]
quant = [
    "bitsandbytes>=0.44.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "requests>=2.32.0",
    "httpx>=0.27.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-requests>=2.32.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/linagora/binoculars-eu"
Repository = "https://github.com/linagora/binoculars-eu"
Issues = "https://github.com/linagora/binoculars-eu/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["binoculars_eu"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# metrics.py is the upstream implementation, kept verbatim (PRD §6.5).
"binoculars_eu/metrics.py" = ["E501", "E502"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=binoculars_eu --cov-report=term-missing --cov-fail-under=70"
markers = [
    "acceptance_cpu: numeric and cache checks, must pass on every platform",
    "acceptance_gpu: warm-latency target < 200 ms (PRD L4-class); requires CUDA or BINOCULARS_EU_HAS_GPU=1",
]
